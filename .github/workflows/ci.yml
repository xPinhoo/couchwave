name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" button in the Actions tab: re-run checks and redeploy main on demand
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a deploy that is already running
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  API_URL: https://couchwave-api.fly.dev

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: API end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker:
    name: Build API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys are skipped (not failed) until the credentials are added to the repo secrets
  deploy-config:
    name: Check deploy credentials
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      fly: ${{ steps.check.outputs.fly }}
      vercel: ${{ steps.check.outputs.vercel }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "fly=$([ -n "$FLY_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "vercel=$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$FLY_API_TOKEN" ] || echo "::notice::FLY_API_TOKEN is not set, skipping the API deploy"
          [ -n "$VERCEL_TOKEN" ] || echo "::notice::VERCEL_TOKEN is not set, skipping the web deploys"

  deploy-api:
    name: Deploy API to Fly.io
    needs: [verify, docker, deploy-config]
    if: needs.deploy-config.outputs.fly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-api
      url: https://couchwave-api.fly.dev
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4

      # --ha=false keeps a single machine: rooms live in memory, so two machines
      # would each have their own rooms (multi-instance needs Redis, see roadmap M6)
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$API_URL/health"

  deploy-web:
    name: Deploy ${{ matrix.app }} to Vercel
    needs: [verify, deploy-config, deploy-api]
    # Still deploy the web apps when the API deploy was skipped (no Fly token yet)
    if: |
      always() && needs.verify.result == 'success'
      && needs.deploy-config.outputs.vercel == 'true'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - app: host
            project_secret: VERCEL_HOST_PROJECT_ID
            url: https://couchwave-host.vercel.app
          - app: controller
            project_secret: VERCEL_CONTROLLER_PROJECT_ID
            url: https://couchwave-controller.vercel.app
    environment:
      name: production-${{ matrix.app }}
      url: ${{ matrix.url }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Build on the runner and upload only the output, so what gets deployed is
      # exactly what this workflow built and tested against
      - run: npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
