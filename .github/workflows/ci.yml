name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" button in the Actions tab: re-run checks and redeploy main on demand
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a deploy that is already running
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# Deployment settings (Settings → Secrets and variables → Actions):
#   variables: API_URL (e.g. https://api.example.com)
#   secrets:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_HOST_PROJECT_ID, VERCEL_CONTROLLER_PROJECT_ID
# and one way to deploy the API:
#   Render:  secret RENDER_DEPLOY_HOOK_URL (used when set)
#   Coolify: variables COOLIFY_URL, COOLIFY_APP_UUID and secret COOLIFY_TOKEN

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: API end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  browser-tests:
    name: Browser tests (TV + phones)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The tests run against the production builds, served locally
      - run: npm run build

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:browser

      # Traces open with `npx playwright show-trace` or at trace.playwright.dev
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Build API Docker image (ARM)
    # Same architecture as the production server (Oracle Cloud Ampere A1)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys are skipped (not failed) until their settings exist
  deploy-config:
    name: Check deploy settings
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - id: check
        env:
          API_URL: ${{ vars.API_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          api=none
          if [ -n "$API_URL" ] && [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            api=render
          elif [ -n "$API_URL" ] && [ -n "$COOLIFY_URL" ] && [ -n "$COOLIFY_APP_UUID" ] && [ -n "$COOLIFY_TOKEN" ]; then
            api=coolify
          fi
          web=$( [ -n "$API_URL" ] && [ -n "$VERCEL_TOKEN" ] && echo true || echo false )
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          [ "$api" != none ] || echo "::notice::API_URL plus RENDER_DEPLOY_HOOK_URL or the Coolify settings are missing, skipping the API deploy"
          [ "$web" = true ] || echo "::notice::API_URL or VERCEL_TOKEN is missing, skipping the web deploys"

  deploy-api-render:
    name: Deploy API (Render)
    needs: [verify, browser-tests, docker, deploy-config]
    if: needs.deploy-config.outputs.api == 'render'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-api
      url: ${{ vars.API_URL }}
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # Render builds the image from apps/api/Dockerfile (see render.yaml). Its auto-deploy
      # is off, so a deploy only happens once the tests passed.
      - name: Trigger the deploy
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA" > /dev/null

      # /health reports the commit it runs, so wait until it is this one. The free plan
      # also sleeps when idle, and the first request wakes it up.
      - name: Wait until the new version is live
        run: |
          for _ in $(seq 1 120); do
            commit=$(curl -sS --max-time 60 "$API_URL/health" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "Live commit: ${commit:-unknown}"
            [ "$commit" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "::error::Timed out waiting for Render to serve $GITHUB_SHA. See the deploy logs in Render."; exit 1

  deploy-api:
    name: Deploy API (Coolify)
    needs: [verify, browser-tests, docker, deploy-config]
    if: needs.deploy-config.outputs.api == 'coolify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-api
      url: ${{ vars.API_URL }}
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      # Coolify builds the image on the server from apps/api/Dockerfile. Its own
      # "deploy on push" is turned off, so a deploy only happens once the tests passed.
      - name: Trigger the deploy
        id: trigger
        run: |
          endpoint="$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST -H "$auth" "$endpoint")
          # Older Coolify versions only accept GET on this endpoint
          if [ "$code" = 405 ]; then
            code=$(curl -sS -o response.json -w '%{http_code}' -H "$auth" "$endpoint")
          fi
          cat response.json; echo
          [ "$code" = 200 ] || { echo "::error::Coolify answered HTTP $code"; exit 1; }
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' response.json)
          [ -n "$deployment" ] || { echo "::error::No deployment_uuid in Coolify's response"; exit 1; }
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to finish
        env:
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: |
          for _ in $(seq 1 120); do
            status=$(curl -sS --fail -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" | jq -r '.status')
            echo "Coolify deployment status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "::error::Coolify deployment $status. See its logs in Coolify."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Coolify"; exit 1

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$API_URL/health"

  deploy-web:
    name: Deploy ${{ matrix.app }} to Vercel
    needs: [verify, browser-tests, deploy-config, deploy-api, deploy-api-render]
    # Still deploy the web apps when the API deploy was skipped (not configured yet)
    if: |
      always() && needs.verify.result == 'success' && needs.browser-tests.result == 'success'
      && needs.deploy-config.outputs.web == 'true'
      && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
      && (needs.deploy-api-render.result == 'success' || needs.deploy-api-render.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - app: host
            project_secret: VERCEL_HOST_PROJECT_ID
            url: https://couchwave-host.vercel.app
            api_env: VITE_API_URL
          - app: controller
            project_secret: VERCEL_CONTROLLER_PROJECT_ID
            url: https://couchwave-controller.vercel.app
            api_env: EXPO_PUBLIC_API_URL
    environment:
      name: production-${{ matrix.app }}
      url: ${{ matrix.url }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The API address lives in one place (the API_URL variable); both apps read it
      # from .env.production.local, which Vite and Expo load for production builds
      - name: Point the build at the API
        env:
          API_URL: ${{ vars.API_URL }}
          API_ENV: ${{ matrix.api_env }}
          APP: ${{ matrix.app }}
        run: echo "$API_ENV=$API_URL" > "apps/$APP/.env.production.local"

      # Build on the runner and upload only the output, so what gets deployed is
      # exactly what this workflow built and tested against
      - run: npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
