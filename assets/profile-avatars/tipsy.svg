<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>.bold { stroke: #000; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }</style>
  <!-- Corpo Desleixado -->
  <path d="M160 440c0-40 30-65 96-65s96 25 96 65z" fill="#93C5FD" class="bold"/>
  <!-- Cabeça Torta -->
  <rect x="145" y="150" width="222" height="195" rx="65" fill="#FFDBB5" class="bold" transform="rotate(5 256 240)"/>
  <!-- Nariz Vermelho Redondo -->
  <circle cx="256" cy="250" r="22" fill="#EF4444" class="bold"/>
  <!-- Olhos Desalinhados (Um aberto, um meio fechado) -->
  <circle cx="205" cy="210" r="32" fill="#FFF" class="bold"/>
  <circle cx="202" cy="214" r="14" fill="#111"/>
  <!-- Olho em "X" ou Semicerrado -->
  <path d="M285 210l25 15M310 210l-25 15" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <!-- Bochechas Muito Bêbedas -->
  <circle cx="175" cy="275" r="22" fill="#FCA5A5" opacity="0.8"/>
  <circle cx="335" cy="275" r="22" fill="#FCA5A5" opacity="0.8"/>
  <!-- Boca Trémula -->
  <path d="M220 295q15-15 35 5t35-10" fill="none" class="bold"/>
  <!-- Bolhas de tontura -->
  <circle cx="160" cy="120" r="8" fill="#93C5FD" stroke="#000" stroke-width="6"/>
  <circle cx="140" cy="140" r="5" fill="#93C5FD" stroke="#000" stroke-width="4"/>
</svg>