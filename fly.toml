# Fly.io config for the API. Deploy from the repository root: fly deploy --ha=false
app = "couchwave-api"
# Paris: closest region to Portugal that still accepts new machines (mad is deprecated)
primary_region = "cdg"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  # Must list the deployed web apps, or browsers will block the WebSocket connection
  CORS_ORIGINS = "https://couchwave-host.vercel.app,https://couchwave-controller.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in memory, so a stopped machine just means "no games running".
  # It starts again on the next request (cold start of a second or two).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
